name: Paper checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax
        run: python -m compileall -q torinteo_paper integrations tests
      - name: Test paper rules and optional provider contracts
        run: python -m unittest discover -s tests -v
      - name: Run labelled synthetic demo
        run: python -m torinteo_paper demo --db "${RUNNER_TEMP}/torinteo-demo.sqlite3"
