[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torinteo-markets"
version = "0.1.0"
description = "An isolated financial paper-trading worker with evidence and deterministic entry gates"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
torinteo-paper = "torinteo_paper.cli:main"

[tool.setuptools.packages.find]
include = ["torinteo_paper*"]
